name = "unco-checkout"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Settings that aren't secret. The Square access token, webhook signature
# key, admin key and Resend API key are NOT here: locally they go in worker/.dev.vars, and on
# Cloudflare they're set with `npx wrangler secret put <NAME>`.
[vars]
SQUARE_ENVIRONMENT = "sandbox"
ALLOWED_ORIGINS = "https://shopunco.com,https://www.shopunco.com,http://localhost:8080"
SITE_URL = "https://shopunco.com"

# New York State sales tax, added to every item at checkout. Shipping is
# free, so there's no SHIPPING_FEE_CENTS. Keep TAX_PERCENTAGE in sync with
# TAX_PERCENT in js/main.js, which shows the same tax in the cart.
TAX_PERCENTAGE = "4"
TAX_NAME = "NY State sales tax"

# Who account emails come from. The domain must be verified in Resend.
EMAIL_FROM = "unco <hello@shopunco.com>"

# The exact URL of the webhook subscription in Square, used to check that
# payment notices really came from Square
SQUARE_WEBHOOK_URL = "https://unco-checkout.unco-checkout.workers.dev/square/webhook"

# Where each order's payment status is kept. Wrangler creates this storage
# on Cloudflare the first time you deploy.
[[kv_namespaces]]
binding = "ORDERS"

# Customer accounts, sign-in codes and sessions
[[kv_namespaces]]
binding = "ACCOUNTS"
